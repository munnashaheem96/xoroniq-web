<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders &amp; Dispatch | XORONIQ Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Manage orders, tracking numbers, customer information, and dispatch status in XORONIQ Car Care.">
  <link rel="icon" type="image/png" href="../images/logo/logo.PNG">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-layout">
    
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <a href="index.html" class="admin-sidebar-brand">
        <img src="../images/logo/logo.PNG" alt="XORONIQ" style="height: 32px; object-fit: contain;" onerror="this.style.display='none'">
        <span class="font-heading fw-bold text-black fs-5 letter-spacing-wide">XORONIQ</span>
      </a>

      <ul class="admin-sidebar-nav">
        <li class="admin-nav-item">
          <a href="index.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        </li>
        <li class="admin-nav-item">
          <a href="products.html"><i class="bi bi-box-seam-fill"></i> Products Catalog</a>
        </li>
        <li class="admin-nav-item active">
          <a href="orders.html"><i class="bi bi-receipt"></i> Orders & Dispatch</a>
        </li>
        <li class="admin-nav-item mt-4">
          <a href="../index.html" target="_blank"><i class="bi bi-box-arrow-up-right"></i> Live Storefront</a>
        </li>
      </ul>

      <div class="admin-sidebar-footer">
        <button class="btn btn-x-outline btn-sm w-100 admin-logout-btn">
          <i class="bi bi-box-arrow-left me-1"></i> Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-icon d-lg-none" id="toggle-sidebar-btn"><i class="bi bi-list fs-4"></i></button>
          <h4 class="font-heading text-black fw-bold mb-0">CUSTOMER ORDERS & DISPATCH</h4>
        </div>
      </header>

      <div class="admin-content-wrap">
        
        <!-- Filter & Search Controls -->
        <div class="glass-panel p-3 mb-4 d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div class="d-flex align-items-center gap-2 flex-grow-1" style="max-width: 400px;">
            <div class="input-group">
              <span class="input-group-text bg-white border text-dark"><i class="bi bi-search"></i></span>
              <input type="text" id="admin-orders-search" class="form-control form-control-custom" placeholder="Search by Order ID, name, or phone...">
            </div>
          </div>

          <div class="d-flex align-items-center gap-3">
            <select id="admin-orders-filter" class="form-select form-control-custom py-2 px-3 small" style="width: auto;">
              <option value="ALL">All Statuses</option>
              <option value="Payment Confirmed">Payment Confirmed</option>
              <option value="Processing">Processing</option>
              <option value="Shipped">Shipped</option>
              <option value="Delivered">Delivered</option>
              <option value="Cancelled">Cancelled</option>
            </select>
            <span class="badge bg-white border text-dark" id="admin-orders-count">0 Orders</span>
          </div>
        </div>

        <!-- Orders Table -->
        <div class="admin-card">
          <div class="table-responsive">
            <table class="table-custom-dark">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Customer</th>
                  <th>Date</th>
                  <th>Items</th>
                  <th>Total</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="admin-orders-table-body">
                <!-- Dynamically populated by js/orders.js -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module">
    import { requireAdminAuth, initAdminLogout } from '../js/auth.js';
    import { initAdminOrdersPage } from '../js/orders.js';

    document.addEventListener('DOMContentLoaded', () => {
      requireAdminAuth();
      initAdminLogout();
      initAdminOrdersPage();

      const toggleBtn = document.getElementById('toggle-sidebar-btn');
      const sidebar = document.getElementById('adminSidebar');
      if (toggleBtn && sidebar) {
        toggleBtn.addEventListener('click', () => {
          sidebar.classList.toggle('show');
        });
      }
    });
  </script>
</body>
</html>
