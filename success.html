<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed &amp; Payment Receipt | XORONIQ Car Care</title>
  <meta name="description" content="Official XORONIQ order confirmation and payment receipt.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="images/logo/logo.PNG">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-alt-custom">

  <!-- Header -->
  <header class="py-4 border-bottom border-secondary border-opacity-25 bg-white text-center">
    <a href="index.html" class="nav-brand-text d-inline-block">
      <img src="images/logo/logo.PNG" alt="XORONIQ" class="nav-brand-logo" onerror="this.style.display='none'; document.getElementById('text-fallback-logo').style.display='inline';">
      <span id="text-fallback-logo" style="display: none;">XORONIQ<span class="dot"></span></span>
    </a>
  </header>

  <main class="py-5">
    <div class="container container-custom" style="max-width: 800px;">
      
      <!-- Confirmation Banner -->
      <div class="text-center mb-5 reveal reveal-fade-up">
        <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-3" style="width: 80px; height: 80px; border: 2px solid #10b981; box-shadow: 0 0 25px rgba(16, 185, 129, 0.3);">
          <i class="bi bi-check-lg display-4"></i>
        </div>
        <h1 class="text-black fw-bold mb-2">ORDER CONFIRMED</h1>
        <p class="text-silver fs-5 mb-1">Thank you for choosing XORONIQ Car Care.</p>
        <div class="font-mono text-accent fw-bold fs-5" id="confirmed-order-id">ORDER #XOR-000000</div>
      </div>

      <!-- Receipt Card -->
      <div class="glass-panel-heavy p-4 p-md-5 mb-4" id="order-receipt-card">
        <div class="d-flex justify-content-between align-items-center pb-3 border-bottom border-secondary border-opacity-25 mb-4">
          <div>
            <div class="font-heading fw-bold text-black fs-5">PAYMENT RECEIPT</div>
            <div class="text-muted-custom small" id="order-date-label"></div>
          </div>
          <span class="badge-status status-paid fs-6 py-2 px-3">
            <i class="bi bi-check-circle-fill"></i> PAID VIA RAZORPAY
          </span>
        </div>

        <!-- Details Grid -->
        <div class="row g-4 mb-4">
          <div class="col-sm-6">
            <h6 class="font-heading text-black fw-bold small mb-2">CUSTOMER</h6>
            <div class="text-silver small" id="order-cust-name">-</div>
            <div class="text-muted-custom small" id="order-cust-email">-</div>
            <div class="text-muted-custom small" id="order-cust-phone">-</div>
          </div>
          <div class="col-sm-6">
            <h6 class="font-heading text-black fw-bold small mb-2">DELIVERY DESTINATION</h6>
            <div class="text-silver small" id="order-shipping-dest">-</div>
          </div>
        </div>

        <!-- Ordered Items Table -->
        <h6 class="font-heading text-black fw-bold small mb-3">ITEMS ORDERED</h6>
        <div class="table-responsive mb-4">
          <table class="table table-custom-dark">
            <thead>
              <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Subtotal</th>
              </tr>
            </thead>
            <tbody id="receipt-items-tbody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>

        <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary border-opacity-25 text-black font-heading fs-5 fw-bold">
          <span>AMOUNT PAID</span>
          <span class="text-accent" id="receipt-grand-total">₹0</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="d-flex flex-wrap gap-3 justify-content-center">
        <a href="tracking.html" class="btn btn-x-primary py-3 px-4" id="track-order-link">
          <i class="bi bi-geo-alt-fill me-1"></i> TRACK ORDER SHIPMENT
        </a>
        <button class="btn btn-x-outline py-3 px-4" onclick="window.print()">
          <i class="bi bi-printer me-1"></i> PRINT RECEIPT
        </button>
        <a href="shop.html" class="btn btn-x-outline py-3 px-4">
          CONTINUE SHOPPING
        </a>
      </div>

    </div>
  </main>

  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { getOrderById } from './js/firebase.js';
    import { formatCurrency, formatDate, getStorage } from './js/utils.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const orderIdParam = urlParams.get('orderId');

      let order = null;

      if (orderIdParam) {
        order = await getOrderById(orderIdParam);
      }
      
      if (!order) {
        order = getStorage('xoroniq_last_order');
      }

      if (!order) {
        document.getElementById('confirmed-order-id').textContent = 'ORDER #PROCESSED';
        return;
      }

      document.getElementById('confirmed-order-id').textContent = `ORDER #${order.orderId}`;
      document.getElementById('order-date-label').textContent = `Placed on ${formatDate(order.createdAt || new Date())}`;
      
      document.getElementById('order-cust-name').textContent = order.customer?.name || 'Customer';
      document.getElementById('order-cust-email').textContent = order.customer?.email || '';
      document.getElementById('order-cust-phone').textContent = `Phone: ${order.customer?.phone || ''}`;

      const addr = order.shippingAddress;
      if (addr) {
        document.getElementById('order-shipping-dest').innerHTML = `
          ${addr.address}<br>
          ${addr.city}, ${addr.state} - ${addr.pincode}<br>
          ${addr.country || 'India'}
        `;
      }

      const tbody = document.getElementById('receipt-items-tbody');
      if (tbody && order.items) {
        tbody.innerHTML = order.items.map(item => `
          <tr>
            <td>
              <div class="d-flex align-items-center gap-2">
                <img src="${item.image}" class="rounded p-1 bg-surface-custom border border-secondary border-opacity-25" style="width: 38px; height: 38px; object-fit: contain;">
                <span class="text-black fw-bold">${item.name}</span>
              </div>
            </td>
            <td class="font-mono text-black">${formatCurrency(item.price)}</td>
            <td>${item.quantity}</td>
            <td class="font-mono text-accent fw-bold">${formatCurrency(item.price * item.quantity)}</td>
          </tr>
        `).join('');
      }

      document.getElementById('receipt-grand-total').textContent = formatCurrency(order.total);
      
      const trackLink = document.getElementById('track-order-link');
      if (trackLink) {
        trackLink.href = `tracking.html?orderId=${order.orderId}`;
      }
    });
  </script>
</body>
</html>
