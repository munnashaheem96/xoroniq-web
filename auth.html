<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Create Account | XORONIQ Car Care</title>
  <meta name="description" content="Sign in or create your XORONIQ account to track orders, save your profile, and get personalized car care recommendations.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="images/logo/logo.PNG">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page-body">

  <!-- Ambient Background -->
  <div class="auth-bg-gradient"></div>
  <div class="auth-bg-grid"></div>

  <!-- Top Logo Bar -->
  <header class="auth-header">
    <a href="index.html" class="auth-logo-link">
      <img src="images/logo/logo.PNG" alt="XORONIQ" class="auth-logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
      <span style="display:none;font-family:var(--x-font-heading);font-weight:900;font-size:1.4rem;">XORONIQ</span>
    </a>
    <a href="index.html" class="auth-back-link">
      <i class="bi bi-arrow-left me-1"></i> Back to Store
    </a>
  </header>

  <!-- Auth Card -->
  <main class="auth-main">
    <div class="auth-card">
      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="auth-tab-login">Sign In</button>
        <button class="auth-tab" id="auth-tab-signup">Create Account</button>
      </div>

      <!-- ── LOGIN PANEL ── -->
      <div id="auth-panel-login">
        <div class="auth-panel-heading">
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Sign in to your XORONIQ account</p>
        </div>

        <!-- Google Sign-In -->
        <button class="google-signin-btn" type="button" id="google-login-btn">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20">
          Continue with Google
        </button>

        <div class="auth-divider"><span>or</span></div>

        <form id="login-form" novalidate>
          <div class="auth-field-group">
            <label class="auth-label" for="login-email">Email Address</label>
            <div class="auth-input-wrap">
              <i class="bi bi-envelope auth-input-icon"></i>
              <input type="email" id="login-email" class="auth-input" placeholder="you@example.com" required autocomplete="email">
            </div>
          </div>

          <div class="auth-field-group">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="auth-label mb-0" for="login-password">Password</label>
              <a href="#" class="auth-link-sm" id="forgot-password-link">Forgot password?</a>
            </div>
            <div class="auth-input-wrap">
              <i class="bi bi-lock auth-input-icon"></i>
              <input type="password" id="login-password" class="auth-input" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="auth-eye-btn" data-target="login-password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-x-primary w-100 mt-1" id="login-btn">
            SIGN IN <i class="bi bi-arrow-right ms-2"></i>
          </button>
        </form>

        <p class="auth-switch-text">
          Don't have an account?
          <a href="#" class="auth-link" data-auth-switch="signup">Create one →</a>
        </p>
      </div>

      <!-- ── SIGNUP PANEL ── -->
      <div id="auth-panel-signup" style="display:none;">
        <div class="auth-panel-heading">
          <h1 class="auth-title">Create account</h1>
          <p class="auth-subtitle">Join XORONIQ — it's free</p>
        </div>

        <!-- Google Sign-In -->
        <button class="google-signin-btn" type="button" id="google-signup-btn">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20">
          Continue with Google
        </button>

        <div class="auth-divider"><span>or</span></div>

        <form id="signup-form" novalidate>
          <div class="auth-field-group">
            <label class="auth-label" for="signup-name">Full Name <span class="text-danger">*</span></label>
            <div class="auth-input-wrap">
              <i class="bi bi-person auth-input-icon"></i>
              <input type="text" id="signup-name" class="auth-input" placeholder="Your full name" required autocomplete="name">
            </div>
          </div>

          <div class="auth-field-group">
            <label class="auth-label" for="signup-email">Email Address <span class="text-danger">*</span></label>
            <div class="auth-input-wrap">
              <i class="bi bi-envelope auth-input-icon"></i>
              <input type="email" id="signup-email" class="auth-input" placeholder="you@example.com" required autocomplete="email">
            </div>
          </div>

          <div class="row g-3">
            <div class="col-6">
              <div class="auth-field-group mb-0">
                <label class="auth-label" for="signup-password">Password <span class="text-danger">*</span></label>
                <div class="auth-input-wrap">
                  <i class="bi bi-lock auth-input-icon"></i>
                  <input type="password" id="signup-password" class="auth-input" placeholder="Min 6 chars" required autocomplete="new-password">
                  <button type="button" class="auth-eye-btn" data-target="signup-password"><i class="bi bi-eye"></i></button>
                </div>
              </div>
            </div>
            <div class="col-6">
              <div class="auth-field-group mb-0">
                <label class="auth-label" for="signup-confirm">Confirm <span class="text-danger">*</span></label>
                <div class="auth-input-wrap">
                  <i class="bi bi-lock-fill auth-input-icon"></i>
                  <input type="password" id="signup-confirm" class="auth-input" placeholder="Repeat" required autocomplete="new-password">
                </div>
              </div>
            </div>
          </div>

          <div class="row g-3 mt-0">
            <div class="col-6">
              <div class="auth-field-group mb-0">
                <label class="auth-label" for="signup-phone">Phone</label>
                <div class="auth-input-wrap">
                  <i class="bi bi-telephone auth-input-icon"></i>
                  <input type="tel" id="signup-phone" class="auth-input" placeholder="+91 XXXXXXXXXX" autocomplete="tel">
                </div>
              </div>
            </div>
            <div class="col-6">
              <div class="auth-field-group mb-0">
                <label class="auth-label" for="signup-city">City</label>
                <div class="auth-input-wrap">
                  <i class="bi bi-geo-alt auth-input-icon"></i>
                  <input type="text" id="signup-city" class="auth-input" placeholder="Your city" autocomplete="address-level2">
                </div>
              </div>
            </div>
          </div>

          <div class="auth-field-group">
            <label class="auth-label">Vehicle Type</label>
            <div class="vehicle-type-selector">
              <label class="vehicle-type-option">
                <input type="radio" name="vehicleType" value="Car" checked>
                <span><i class="bi bi-car-front me-1"></i>Car</span>
              </label>
              <label class="vehicle-type-option">
                <input type="radio" name="vehicleType" value="Bike">
                <span><i class="bi bi-bicycle me-1"></i>Bike</span>
              </label>
              <label class="vehicle-type-option">
                <input type="radio" name="vehicleType" value="Both">
                <span><i class="bi bi-collection me-1"></i>Both</span>
              </label>
            </div>
          </div>

          <button type="submit" class="btn btn-x-primary w-100" id="signup-btn">
            CREATE ACCOUNT <i class="bi bi-arrow-right ms-2"></i>
          </button>

          <p class="auth-terms-note">
            By creating an account, you agree to XORONIQ's terms of service and privacy policy.
          </p>
        </form>

        <p class="auth-switch-text">
          Already have an account?
          <a href="#" class="auth-link" data-auth-switch="login">Sign in →</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module">
    import { initAuthPage } from './js/user.js';

    // Password toggle
    document.querySelectorAll('.auth-eye-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        const isPass = input.type === 'password';
        input.type = isPass ? 'text' : 'password';
        btn.querySelector('i').className = isPass ? 'bi bi-eye-slash' : 'bi bi-eye';
      });
    });

    initAuthPage();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
