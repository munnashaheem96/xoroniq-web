<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | XORONIQ Car Care</title>
  <meta name="description" content="Manage your XORONIQ account, view order history, and update your profile.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="images/logo/logo.PNG">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- ── NAVBAR ── -->
  <nav class="navbar navbar-expand-lg xoroniq-navbar">
    <div class="container container-custom">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="images/logo/logo.PNG" alt="XORONIQ" class="nav-brand-logo" onerror="this.style.display='none';">
      </a>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <a href="index.html" class="btn btn-x-outline-accent btn-sm">← Back to Store</a>
        <span class="user-nav-icon-wrap"></span>
      </div>
    </div>
  </nav>

  <!-- ── PROFILE HERO ── -->
  <section class="profile-hero-section">
    <div class="container container-custom">
      <div class="profile-hero-card">
        <div class="profile-avatar-wrap">
          <div class="profile-avatar-circle" id="profile-avatar">?</div>
        </div>
        <div class="profile-hero-info">
          <h1 class="profile-display-name" id="profile-name">Loading...</h1>
          <p class="profile-display-email" id="profile-email"></p>
          <p class="profile-display-since" id="profile-since"></p>
        </div>
        <button class="btn btn-x-outline-accent btn-sm ms-auto" id="profile-signout-btn">
          <i class="bi bi-box-arrow-right me-1"></i> Sign Out
        </button>
      </div>
    </div>
  </section>

  <!-- ── MAIN CONTENT ── -->
  <main class="section-padding bg-alt">
    <div class="container container-custom">
      <div class="row g-4">

        <!-- ── EDIT PROFILE ── -->
        <div class="col-lg-5">
          <div class="profile-section-card">
            <div class="profile-section-header">
              <i class="bi bi-person-gear me-2 text-accent"></i>
              <h2 class="profile-section-title">Edit Profile</h2>
            </div>
            <form id="profile-edit-form" novalidate>
              <div class="auth-field-group">
                <label class="auth-label" for="profile-name-input">Full Name</label>
                <div class="auth-input-wrap">
                  <i class="bi bi-person auth-input-icon"></i>
                  <input type="text" id="profile-name-input" class="auth-input" placeholder="Your full name">
                </div>
              </div>
              <div class="auth-field-group">
                <label class="auth-label" for="profile-phone">Phone Number</label>
                <div class="auth-input-wrap">
                  <i class="bi bi-telephone auth-input-icon"></i>
                  <input type="tel" id="profile-phone" class="auth-input" placeholder="+91 XXXXXXXXXX">
                </div>
              </div>
              <div class="auth-field-group">
                <label class="auth-label" for="profile-city">City</label>
                <div class="auth-input-wrap">
                  <i class="bi bi-geo-alt auth-input-icon"></i>
                  <input type="text" id="profile-city" class="auth-input" placeholder="Your city">
                </div>
              </div>
              <div class="auth-field-group">
                <label class="auth-label" for="profile-vehicleModel">Vehicle Make & Model</label>
                <div class="auth-input-wrap">
                  <i class="bi bi-car-front auth-input-icon"></i>
                  <input type="text" id="profile-vehicleModel" class="auth-input" placeholder="e.g. Hyundai Creta, RE Meteor 350">
                </div>
              </div>
              <div class="auth-field-group">
                <label class="auth-label">Vehicle Type</label>
                <div class="vehicle-type-selector">
                  <label class="vehicle-type-option">
                    <input type="radio" name="editVehicleType" value="Car" checked>
                    <span><i class="bi bi-car-front me-1"></i>Car</span>
                  </label>
                  <label class="vehicle-type-option">
                    <input type="radio" name="editVehicleType" value="Bike">
                    <span><i class="bi bi-bicycle me-1"></i>Bike</span>
                  </label>
                  <label class="vehicle-type-option">
                    <input type="radio" name="editVehicleType" value="Both">
                    <span><i class="bi bi-collection me-1"></i>Both</span>
                  </label>
                </div>
              </div>
              <button type="submit" class="btn btn-x-primary w-100" id="profile-save-btn">
                SAVE CHANGES <i class="bi bi-check2 ms-2"></i>
              </button>
            </form>
          </div>
        </div>

        <!-- ── MY ORDERS ── -->
        <div class="col-lg-7" id="profile-orders-section">
          <div class="profile-section-card">
            <div class="profile-section-header">
              <i class="bi bi-bag-check me-2 text-accent"></i>
              <h2 class="profile-section-title">My Orders</h2>
            </div>
            <div id="profile-orders-list">
              <div class="text-center py-5">
                <span class="spinner-border text-accent"></span>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- ── FOOTER MINI ── -->
  <footer class="py-4 border-top text-center" style="background:#fff;font-size:.85rem;color:var(--x-text-muted);">
    © 2026 XORONIQ Car Care • <a href="contact.html" class="text-accent">Contact Support</a>
  </footer>

  <script type="module">
    import { initProfilePage } from './js/user.js';
    import { initUserNavbar } from './js/user.js';
    initUserNavbar();
    initProfilePage();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
